<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MD — KnightSlide</title>
  <style>
    html, body { height: 100%; height: 100dvh; margin: 0; background: #14100b; display: flex; flex-direction: column; align-items: center; justify-content: center; overscroll-behavior: none; }
    #topChrome { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 450px; min-height: 44px; flex-shrink: 0; margin: 0 0 6px; }
    #wrap { position: relative; width: 450px; height: 800px; }
    #loadOverlay {
      position: absolute; inset: 0; z-index: 14;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; background: rgba(10, 8, 5, 0.92); color: #f0e6d2; text-align: center;
      font-family: 'Malgun Gothic', sans-serif;
    }
    #loadOverlay.hidden { display: none; }
    #loadOverlay h1 { font-size: 36px; margin: 0; }
    .load-track { width: 72%; max-width: 280px; height: 14px; background: #241c11; border: 2px solid #7a5c2e; border-radius: 8px; overflow: hidden; }
    .load-fill { height: 100%; width: 0%; background: linear-gradient(180deg, #e8c878, #a8854a); }
    #loadPct { font-size: 22px; font-weight: bold; color: #ffe7a0; margin: 0; }
    .load-label { font-size: 13px; color: #9a8a6a; margin: 0; }
  </style>
</head>
<body>
  <div id="topChrome">
    <div id="scaleHost"></div>
    <div id="chromeRight"></div>
  </div>
  <div id="wrap">
    <canvas id="game" width="450" height="800"></canvas>
    <div id="loadOverlay" class="overlay">
      <h1>⚔ KnightSlide</h1>
      <p class="sub">불러오는 중</p>
      <div class="load-track">
        <div id="loadFill" class="load-fill"></div>
      </div>
      <p id="loadPct">0%</p>
      <p id="loadLabel" class="load-label">준비 중</p>
    </div>
    <div id="startOverlay" class="overlay">
      <h1 id="gameTitle">⚔ KnightSlide</h1>
      <p id="gameSubtitle" class="sub">[프로토타입 0.0.260826]</p>
      <p id="metaStatus" class="sub"></p>
      <p class="tap">탭하여 시작</p>
    </div>
    <div id="gameoverOverlay" class="overlay hidden">
      <h1>패배</h1>
      <p id="finalScore" class="sub"></p>
      <button id="restartBtn">다시 시작</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
