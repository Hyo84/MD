<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MD — KnightSlide</title>
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      background: #14100b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      overscroll-behavior: none;
    }
    #wrap {
      position: relative;
      flex-shrink: 0;
      --fit-w: min(450px, calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
      --fit-h: min(800px, calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)));
      width: min(var(--fit-w), calc(var(--fit-h) * 450 / 800));
      height: min(var(--fit-h), calc(var(--fit-w) * 800 / 450));
    }
    #loadOverlay {
      position: absolute; inset: 0; z-index: 14;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; background: rgba(10, 8, 5, 0.92); color: #f0e6d2; text-align: center;
      font-family: 'Malgun Gothic', sans-serif;
      box-sizing: border-box;
    }
    #loadOverlay.hidden { display: none; }
    #loadOverlay h1 { font-size: 36px; margin: 0; }
    .load-track { width: 72%; max-width: 280px; height: 14px; background: #241c11; border: 2px solid #7a5c2e; border-radius: 8px; overflow: hidden; }
    .load-fill { height: 100%; width: 0%; background: linear-gradient(180deg, #e8c878, #a8854a); }
    #loadPct { font-size: 22px; font-weight: bold; color: #ffe7a0; margin: 0; }
    .load-label { font-size: 13px; color: #9a8a6a; margin: 0; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="450" height="800"></canvas>
    <div id="chromeLeft">
      <div id="scaleHost"></div>
    </div>
    <div id="chromeCamp" class="hidden"></div>
    <div id="chromeRight"></div>
    <div id="loadOverlay" class="overlay">
      <h1>⚔ KnightSlide</h1>
      <p class="sub">불러오는 중</p>
      <div class="load-track">
        <div id="loadFill" class="load-fill"></div>
      </div>
      <p id="loadPct">0%</p>
      <p id="loadLabel" class="load-label">준비 중</p>
    </div>
    <div id="tutorialOverlay" class="hidden" aria-live="polite">
      <div id="tutorialBand" class="tutorial-band"></div>
      <div id="tutorialSpot" class="tutorial-spot hidden"></div>
      <div id="tutorialBalloon" class="tutorial-balloon">
        <strong id="tutorialTitle"></strong>
        <p id="tutorialText"></p>
        <span id="tutorialHint">탭하여 다음</span>
      </div>
    </div>
    <div id="startOverlay" class="overlay">
      <h1 id="gameTitle">⚔ KnightSlide</h1>
      <p id="gameSubtitle" class="sub">프로토타입 v0.0.5</p>
      <p id="metaStatus" class="sub"></p>
      <p id="tapToStart" class="tap">탭하여 시작</p>
      <div id="startChoices" class="start-choices hidden">
        <button id="startEstateBtn" type="button">영지로</button>
        <button id="startPlayBtn" type="button">게임 시작</button>
      </div>
    </div>
    <div id="gameoverOverlay" class="overlay hidden">
      <h1 id="resultTitle">패배</h1>
      <p id="finalScore" class="sub"></p>
      <div id="resultXp" class="result-xp"></div>
      <div class="start-choices">
        <button id="estateFromResult" type="button">영지로</button>
        <button id="restartBtn" type="button">다시 시작</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
